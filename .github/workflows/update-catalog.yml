name: Update catalog cache

on:
  schedule:
    - cron: '0 4 * * *'  # diario 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-catalog.mjs ./datasets.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets.json
          git diff --cached --quiet || git commit -m "chore: actualiza datasets.json [skip ci]"
          git push
